<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin LGNS — 제안·문의</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.min.css">
<link rel="stylesheet" href="assets/shell.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050805">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Origin LGNS">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<style>
:root{
  --bg-0:#050805;--bg-1:#0a1109;--bg-2:#0f1a0e;--bg-card:#0e1610;--bg-card-2:#121f12;
  --border:rgba(159,232,112,.18);--border-strong:rgba(159,232,112,.35);
  --neon:#9FE870;--neon-bright:#B5FF7D;--neon-dim:#6BB048;--text:#E8F5E0;--text-dim:#9CA89A;--text-faint:#6B7569;
  --danger:#FF6B6B;--warn:#FFB84D;--gold:#E8C547;--info:#7FD4E8;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;background:var(--bg-0);color:var(--text);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 1400px 700px at 50% -240px,rgba(159,232,112,.08),transparent),radial-gradient(ellipse 900px 500px at 100% 40%,rgba(159,232,112,.03),transparent)}

.top{max-width:680px;margin:0 auto;padding:clamp(14px,2.6vw,24px) 20px 0;display:flex;flex-direction:column;gap:11px}
.logo{font-size:clamp(18px,1.9vw,25px);font-weight:900;color:var(--neon);text-shadow:0 0 24px rgba(159,232,112,.4)}
.tagline{font-size:12px;color:var(--text-faint)}

.page{max-width:680px;margin:0 auto;padding:clamp(18px,3vw,30px) 20px 90px}
h1{font-size:clamp(24px,3.6vw,33px);font-weight:900;margin:14px 0 8px;color:var(--text)}
.lead{font-size:15px;color:var(--neon);font-weight:700;margin:0 0 10px}
.desc{font-size:14.5px;color:var(--text-dim);line-height:1.65;margin:0}

.email-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(159,232,112,.05),transparent 70%),var(--bg-card);
  border:1px solid var(--border);border-radius:13px;padding:13px 15px;margin:22px 0 28px}
.email-label{font-size:12px;font-weight:700;color:var(--text-dim)}
.email-addr{font-family:var(--mono);font-size:15px;color:var(--neon-bright);text-decoration:none;font-weight:700;word-break:break-all}
.email-addr:hover{text-decoration:underline}
.copy-btn{margin-left:auto;background:none;border:1px solid var(--border-strong);color:var(--text-dim);
  border-radius:8px;font:700 12px/1 var(--mono);padding:7px 13px;cursor:pointer;transition:.15s;white-space:nowrap}
.copy-btn:hover{color:var(--neon);border-color:var(--neon)}

form{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:clamp(16px,2.4vw,24px)}
.field{margin-bottom:16px}
.field:last-of-type{margin-bottom:8px}
label{display:block;font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:7px}
label .opt{color:var(--text-faint);font-weight:400}
input,select,textarea{width:100%;background:var(--bg-0);border:1px solid var(--border-strong);border-radius:10px;
  color:var(--text);font-family:inherit;font-size:15px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(159,232,112,.12)}
textarea{resize:vertical;min-height:130px;line-height:1.55}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:36px}
.sel::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;font-size:12px}
.send-btn{width:100%;margin-top:8px;background:var(--neon);color:var(--bg-0);border:0;border-radius:12px;
  font-weight:800;font-size:15px;padding:14px;cursor:pointer;box-shadow:0 0 22px rgba(159,232,112,.35);transition:filter .15s,transform .05s}
.send-btn:hover{filter:brightness(1.08)}
.send-btn:active{transform:translateY(1px)}
.hint{font-size:12px;color:var(--text-faint);margin:11px 2px 0;line-height:1.55}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ts-wrap{margin:2px 0 14px}
.status{margin:12px 2px 0;font-size:13.5px;font-weight:700;line-height:1.5;border-radius:10px;padding:11px 13px}
.status.ok{color:var(--neon);background:rgba(159,232,112,.09);border:1px solid rgba(159,232,112,.28)}
.status.err{color:var(--danger);background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.30)}
.send-btn:disabled{opacity:.6;cursor:default;filter:none}
</style>
</head>
<body>
  <header class="top">
    <div class="logo"><img class="brand-sym" src="assets/symbol.png" alt=""> Origin LGNS</div>
    <nav class="nav-tabs"><a class="nav-tab" href="index.html">시세</a><a class="nav-tab" href="rates.html">이율</a><a class="nav-tab active" href="contact.html">제안·문의</a></nav>
    <div class="tagline">여러분의 목소리로 도구가 자랍니다</div>
  </header>

  <main class="page">
    <h1>제안·문의</h1>
    <p class="lead">여러분의 피드백이 다음 도구를 만듭니다.</p>
    <p class="desc">버그 제보, 나왔으면 하는 도구, 사용 중 궁금한 점 — 무엇이든 편하게 보내주세요. 다양한 의견과 아이디어를 기다립니다.</p>

    <div class="email-row">
      <span class="email-label">📮 직접 메일</span>
      <a class="email-addr" href="mailto:contact@awakeorigin.direct">contact@awakeorigin.direct</a>
      <button id="copyBtn" class="copy-btn" type="button" onclick="copyEmail()">복사</button>
    </div>

    <form id="fbForm" onsubmit="return sendFeedback(event)" novalidate>
      <div class="field">
        <label for="fType">유형</label>
        <div class="sel"><select id="fType">
          <option>버그 제보</option>
          <option>도구 제안</option>
          <option>일반 문의</option>
          <option>기타</option>
        </select></div>
      </div>
      <div class="field">
        <label for="fEmail">회신받을 이메일 <span class="opt">(선택)</span></label>
        <input id="fEmail" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
      </div>
      <div class="field">
        <label for="fMsg">내용</label>
        <textarea id="fMsg" rows="6" placeholder="버그 상황, 원하는 기능, 문의 내용을 자유롭게 적어주세요."></textarea>
      </div>
      <!-- 봇 방지 허니팟(사람에겐 보이지 않음) -->
      <div class="hp" aria-hidden="true"><label>website<input id="fHp" type="text" tabindex="-1" autocomplete="off"></label></div>
      <div id="tsWrap" class="ts-wrap" hidden></div>
      <button id="fbBtn" type="submit" class="send-btn">보내기 →</button>
      <p id="fbStatus" class="status" role="status" hidden></p>
      <p class="hint">사이트에서 바로 전송됩니다. 전송이 안 되면 위 <b>contact@awakeorigin.direct</b> 주소로 직접 보내주세요.</p>
    </form>
  </main>

  <div class="signature">SpaceEchoBoy</div>

<script>
"use strict";
function copyEmail(){
  var addr='contact@awakeorigin.direct',b=document.getElementById('copyBtn'),o=b.textContent;
  function done(){b.textContent='복사됨 ✓';setTimeout(function(){b.textContent=o;},1500);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(addr).then(done).catch(function(){window.prompt('주소를 복사하세요',addr);});}
  else{window.prompt('주소를 복사하세요',addr);}
}
// ── 폼 백엔드 설정 ──
var CFG = {
  endpoint: "https://origin-feedback.awakeorigindirect.workers.dev", // 배포된 워커
  turnstileSitekey: ""  // (선택) Turnstile 사이트키. 비우면 위젯 미표시(허니팟만 사용)
};
// Turnstile 위젯: 사이트키가 있을 때만 렌더
(function(){
  if(!CFG.turnstileSitekey) return;
  var w=document.getElementById('tsWrap'); if(!w) return; w.hidden=false;
  var d=document.createElement('div'); d.className='cf-turnstile';
  d.setAttribute('data-sitekey',CFG.turnstileSitekey); d.setAttribute('data-theme','dark');
  w.appendChild(d);
  var s=document.createElement('script'); s.src='https://challenges.cloudflare.com/turnstile/v0/api.js'; s.async=true; s.defer=true;
  document.head.appendChild(s);
})();
function fbShow(msg,kind){var el=document.getElementById('fbStatus');if(!el)return;el.textContent=msg;el.className='status '+kind;el.hidden=false;}
async function sendFeedback(e){
  e.preventDefault();
  var btn=document.getElementById('fbBtn');
  var type=document.getElementById('fType').value;
  var email=document.getElementById('fEmail').value.trim();
  var msgEl=document.getElementById('fMsg'), message=msgEl.value.trim();
  var website=document.getElementById('fHp').value;
  if(!message){msgEl.focus();fbShow('내용을 입력해 주세요.','err');return false;}
  var token='';
  if(CFG.turnstileSitekey){token=(window.turnstile&&window.turnstile.getResponse())||'';
    if(!token){fbShow('스팸 방지 인증을 완료해 주세요.','err');return false;}}
  btn.disabled=true;fbShow('전송 중…','ok');
  try{
    var r=await fetch(CFG.endpoint,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({type:type,email:email,message:message,website:website,turnstileToken:token})});
    var d={};try{d=await r.json();}catch(_){}
    if(r.ok&&d.ok){fbShow('보내주셔서 감사합니다! 소중한 의견 잘 받았습니다.','ok');
      msgEl.value='';document.getElementById('fEmail').value='';}
    else{fbShow('전송에 실패했어요. 위 contact@awakeorigin.direct 주소로 직접 보내주세요.','err');}
  }catch(err){fbShow('네트워크 오류로 전송하지 못했어요. 위 주소로 직접 보내주세요.','err');}
  btn.disabled=false;
  if(window.turnstile)try{window.turnstile.reset();}catch(_){}
  return false;
}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
